<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krapao - เข้าสู่ระบบ</title>
  
  <!-- โหลด Tailwind CSS และ FontAwesome ไอคอน -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 flex justify-center items-start min-h-screen">

  <div class="w-full max-w-md bg-white min-h-screen flex flex-col justify-between p-6 shadow-xl relative text-gray-800">

    <!-- ส่วนหัว: โลโก้และชื่อแอป -->
    <div class="pt-12 text-center">
      <div class="w-16 h-16 rounded-2xl bg-blue-600 text-white flex items-center justify-center font-bold text-2xl mx-auto shadow-lg mb-4">
        <i class="fa-solid fa-wallet"></i>
      </div>
      <h1 class="text-2xl font-bold text-gray-900">Krapao</h1>
      <p class="text-xs text-gray-400 mt-1">แอปพลิเคชันบริหารการเงินส่วนบุคคล</p>
    </div>

    <!-- ฟอร์มเข้าสู่ระบบ -->
    <form id="loginForm" class="space-y-4 my-auto">
      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1">อีเมลผู้ใช้งาน</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400">
            <i class="fa-solid fa-envelope text-xs"></i>
          </span>
          <input type="email" id="emailInput" placeholder="name@example.com" class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-blue-500 bg-gray-50" required>
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-gray-500 mb-1">รหัสผ่าน</label>
        <div class="relative">
          <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400">
            <i class="fa-solid fa-lock text-xs"></i>
          </span>
          <input type="password" id="passwordInput" placeholder="••••••••" class="w-full pl-10 pr-4 py-3 rounded-xl border border-gray-200 text-sm focus:outline-none focus:border-blue-500 bg-gray-50" required>
        </div>
      </div>

      <div class="flex items-center justify-between text-xs text-gray-500 pt-1">
        <label class="flex items-center gap-2 cursor-pointer">
          <input type="checkbox" id="rememberMe" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
          <span>จำการเข้าสู่ระบบ</span>
        </label>
        <button type="button" onclick="openForgotPasswordModal()" class="text-blue-600 hover:underline bg-transparent border-none cursor-pointer p-0 text-xs">ลืมรหัสผ่าน?</button>
      </div>

      <button type="submit" id="btnLoginSubmit" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-sm shadow-lg shadow-blue-500/30 transition mt-2">
        เข้าสู่ระบบ
      </button>
    </form>

    <!-- ส่วนท้าย: สมัครสมาชิก -->
    <div class="text-center pb-6 text-xs text-gray-500">
      ยังไม่มีบัญชีผู้ใช้งาน? <button type="button" onclick="openRegisterModal()" class="text-blue-600 font-bold hover:underline bg-transparent border-none cursor-pointer p-0 text-xs">สมัครสมาชิก</button>
    </div>

  </div>

  <!-- POPUP: สมัครสมาชิก -->
  <div id="registerModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-end justify-center">
    <div class="bg-white w-full max-w-md rounded-t-3xl p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-4 border-b pb-3">
        <h3 class="font-bold text-lg text-gray-800">สมัครสมาชิก Krapao</h3>
        <button onclick="closeRegisterModal()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <form onsubmit="handleRegister(event)" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">อีเมลของคุณ</label>
          <input type="email" id="regEmail" placeholder="name@example.com" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm bg-gray-50 focus:outline-none focus:border-blue-500" required>
        </div>
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">ตั้งรหัสผ่าน (อย่างน้อย 6 ตัวอักษร)</label>
          <input type="password" id="regPassword" placeholder="••••••••" minlength="6" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm bg-gray-50 focus:outline-none focus:border-blue-500" required>
        </div>
        <button type="submit" id="btnRegisterSubmit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-sm shadow-md transition mt-4">
          ยืนยันการสมัครสมาชิก
        </button>
      </form>
    </div>
  </div>

  <!-- POPUP: ลืมรหัสผ่าน -->
  <div id="forgotPasswordModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-end justify-center">
    <div class="bg-white w-full max-w-md rounded-t-3xl p-6 shadow-2xl">
      <div class="flex justify-between items-center mb-4 border-b pb-3">
        <h3 class="font-bold text-lg text-gray-800">กู้คืนรหัสผ่าน</h3>
        <button onclick="closeForgotPasswordModal()" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-500 hover:bg-gray-200">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
      <form onsubmit="handleForgotPassword(event)" class="space-y-4">
        <p class="text-xs text-gray-500">กรอกอีเมลที่คุณใช้สมัครสมาชิก ระบบจะส่งลิงก์สำหรับรีเซ็ตรหัสผ่านไปให้</p>
        <div>
          <label class="block text-xs font-semibold text-gray-500 mb-1">อีเมลของคุณ</label>
          <input type="email" id="forgotEmail" placeholder="name@example.com" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 text-sm bg-gray-50 focus:outline-none focus:border-blue-500" required>
        </div>
        <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white rounded-xl font-bold text-sm shadow-md transition mt-4">
          ส่งลิงก์รีเซ็ตรหัสผ่าน
        </button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>

  <script>
    window.onload = async function() {
      const savedEmail = localStorage.getItem('krapao_email');
      if (savedEmail) {
        document.getElementById('emailInput').value = savedEmail;
        document.getElementById('rememberMe').checked = true;
      }

      // ถ้า Login อยู่แล้ว ให้ข้ามไปหน้า index.html
      if (typeof getCurrentUser === 'function') {
        const user = await getCurrentUser();
        if (user) {
          window.location.href = 'index.html';
        }
      }
    }

    // เข้าสู่ระบบผ่าน Supabase Auth
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      const email = document.getElementById('emailInput').value;
      const password = document.getElementById('passwordInput').value;
      const remember = document.getElementById('rememberMe').checked;
      const btn = document.getElementById('btnLoginSubmit');

      btn.disabled = true;
      btn.innerText = 'กำลังเข้าสู่ระบบ...';

      if (typeof signIn === 'function') {
        const success = await signIn(email, password);
        if (success) {
          if (remember) {
            localStorage.setItem('krapao_email', email);
          } else {
            localStorage.removeItem('krapao_email');
          }
          window.location.href = 'index.html';
        } else {
          btn.disabled = false;
          btn.innerText = 'เข้าสู่ระบบ';
        }
      }
    });

    // สมัครสมาชิกผ่าน Supabase Auth
    async function handleRegister(e) {
      e.preventDefault();
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      const btn = document.getElementById('btnRegisterSubmit');

      btn.disabled = true;
      btn.innerText = 'กำลังสมัครสมาชิก...';

      if (typeof signUp === 'function') {
        const success = await signUp(email, password);
        if (success) {
          closeRegisterModal();
        }
      }
      btn.disabled = false;
      btn.innerText = 'ยืนยันการสมัครสมาชิก';
    }

    // ลืมรหัสผ่าน
    async function handleForgotPassword(e) {
      e.preventDefault();
      const email = document.getElementById('forgotEmail').value;

      if (window.dbClient) {
        const { data, error } = await window.dbClient.auth.resetPasswordForEmail(email);
        if (error) {
          alert('เกิดข้อผิดพลาด: ' + error.message);
        } else {
          alert('ระบบได้ส่งลิงก์รีเซ็ตรหัสผ่านไปยังอีเมลของคุณแล้ว');
          closeForgotPasswordModal();
        }
      }
    }

    function openRegisterModal() {
      document.getElementById('registerModal').classList.remove('hidden');
    }
    function closeRegisterModal() {
      document.getElementById('registerModal').classList.add('hidden');
    }
    function openForgotPasswordModal() {
      document.getElementById('forgotPasswordModal').classList.remove('hidden');
    }
    function closeForgotPasswordModal() {
      document.getElementById('forgotPasswordModal').classList.add('hidden');
    }
  </script>
</body>
</html>
