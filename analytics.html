<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Krapao - Analytics</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>
</head>
<body class="bg-gray-100 flex justify-center items-start min-h-screen">

  <div class="w-full max-w-md bg-gray-50 min-h-screen pb-28 flex flex-col text-gray-800 shadow-xl relative">

    <header class="flex items-center justify-between px-4 py-3 bg-white shadow-sm sticky top-0 z-40">
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold">
          <i class="fa-solid fa-chart-pie text-sm"></i>
        </div>
        <div>
          <span class="font-bold text-sm text-gray-900 block leading-tight">วิเคราะห์การเงิน</span>
          <span id="userEmailDisplay" class="text-[10px] text-gray-400">กำลังโหลด...</span>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <div id="analyticsHeaderBadge" class="bg-blue-50 text-blue-600 px-2.5 py-1 rounded-full text-[11px] font-semibold">
          2026-10-04
        </div>
        <button onclick="handleLogout()" class="w-8 h-8 rounded-full bg-gray-100 hover:bg-rose-50 text-gray-500 hover:text-rose-600 flex items-center justify-center text-xs transition" title="ออกจากระบบ">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </header>

    <!-- แถบเลือกช่วงเวลาสำหรับวิเคราะห์ -->
    <div class="bg-white px-4 py-3 border-b border-gray-100 shadow-sm">
      <div id="singleDateController" class="flex items-center justify-between mb-2">
        <button onclick="changeDate(-1)" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-gray-200">
          <i class="fa-solid fa-chevron-left text-xs"></i>
        </button>
        <div id="currentDateDisplay" class="bg-gray-100 px-4 py-1.5 rounded-full text-xs font-bold text-gray-700">
          2026-10-04
        </div>
        <button onclick="changeDate(1)" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center text-gray-600 hover:bg-gray-200">
          <i class="fa-solid fa-chevron-right text-xs"></i>
        </button>
      </div>

      <div id="customRangeController" class="hidden flex items-center gap-2 mb-2 text-xs">
        <input type="date" id="startDate" onchange="loadAnalyticsData()" class="w-1/2 px-2 py-1.5 rounded-lg border border-gray-200 bg-gray-50">
        <span class="text-gray-400">ถึง</span>
        <input type="date" id="endDate" onchange="loadAnalyticsData()" class="w-1/2 px-2 py-1.5 rounded-lg border border-gray-200 bg-gray-50">
      </div>

      <div class="flex justify-between text-xs text-gray-500 pt-1 px-1">
        <span onclick="switchView('day')" id="viewDay" class="font-bold text-blue-600 border-b-2 border-blue-600 pb-1 cursor-pointer">วัน</span>
        <span onclick="switchView('month')" id="viewMonth" class="cursor-pointer hover:text-black pb-1">เดือน</span>
        <span onclick="switchView('year')" id="viewYear" class="cursor-pointer hover:text-black pb-1">ปี</span>
        <span onclick="switchView('all')" id="viewAll" class="cursor-pointer hover:text-black pb-1">ทั้งหมด</span>
        <span onclick="switchView('custom')" id="viewCustom" class="cursor-pointer hover:text-black pb-1 text-blue-500 font-medium">ช่วงที่กำหนด</span>
      </div>
    </div>

    <!-- ปุ่มสลับเลือกดู รายรับ, รายจ่าย หรือ โอนเงิน/ชำระหนี้ -->
    <div class="px-4 mt-4">
      <div class="grid grid-cols-3 gap-1 p-1 bg-gray-200 rounded-xl text-xs font-bold text-center">
        <button onclick="switchTabType('expense')" id="tabExpense" class="py-2 bg-white rounded-lg shadow-sm text-red-500 transition">รายจ่าย</button>
        <button onclick="switchTabType('income')" id="tabIncome" class="py-2 text-gray-500 transition">รายรับ</button>
        <button onclick="switchTabType('transfer')" id="tabTransfer" class="py-2 text-gray-500 transition">โอน / ชำระหนี้</button>
      </div>
    </div>

    <!-- ส่วนสรุปยอดจำแนกตามช่องทาง -->
    <div class="px-4 mt-3">
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
        <h3 class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">สรุปยอดตามประเภทช่องทาง</h3>
        <div class="grid grid-cols-3 gap-2 text-center">
          <div class="bg-emerald-50/70 p-2.5 rounded-xl border border-emerald-100">
            <span class="text-[10px] text-emerald-600 font-semibold block"><i class="fa-solid fa-money-bill-wave mr-1"></i>เงินสด</span>
            <span id="cashMethodTotal" class="text-xs font-bold text-gray-800">฿0</span>
          </div>
          <div class="bg-blue-50/70 p-2.5 rounded-xl border border-blue-100">
            <span class="text-[10px] text-blue-600 font-semibold block"><i class="fa-solid fa-building-columns mr-1"></i>เงินโอน/ธนาคาร</span>
            <span id="bankMethodTotal" class="text-xs font-bold text-gray-800">฿0</span>
          </div>
          <div class="bg-rose-50/70 p-2.5 rounded-xl border border-rose-100">
            <span class="text-[10px] text-rose-600 font-semibold block"><i class="fa-solid fa-credit-card mr-1"></i>บัตรเครดิต</span>
            <span id="creditMethodTotal" class="text-xs font-bold text-rose-600">฿0</span>
          </div>
        </div>
      </div>
    </div>

    <!-- ส่วนแสดงสัดส่วนหมวดหมู่ -->
    <div class="px-4 my-3">
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
        <div class="flex justify-between items-center mb-3">
          <h3 id="breakdownTitle" class="text-xs font-semibold text-gray-400 uppercase tracking-wider">สัดส่วนรายจ่ายตามหมวดหมู่</h3>
          <button onclick="filterByCategory('all')" id="resetFilterBtn" class="text-[11px] text-blue-600 font-medium hover:underline hidden">แสดงทั้งหมด</button>
        </div>
        
        <div id="breakdownContainer" class="space-y-3.5 text-xs">
        </div>
      </div>
    </div>

    <!-- ส่วนรายการธุรกรรม -->
    <div class="px-4 my-2 mb-8">
      <div class="bg-white rounded-2xl p-4 shadow-sm border border-gray-100">
        <div class="flex justify-between items-center mb-3">
          <h3 id="transactionListTitle" class="text-xs font-semibold text-gray-400 uppercase tracking-wider">รายการในช่วงนี้ (ทั้งหมด)</h3>
        </div>
        
        <div id="transactionContainer" class="space-y-2.5 text-xs">
        </div>
      </div>
    </div>

    <!-- แถบเมนูด้านล่าง -->
    <nav class="fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white/90 backdrop-blur-md border-t border-gray-200 px-6 py-3 flex justify-between items-center z-50 rounded-t-3xl shadow-lg">
      <a href="index.html" class="flex flex-col items-center text-gray-400 hover:text-blue-600 transition">
        <i class="fa-solid fa-list-ul text-lg"></i>
      </a>
      <a href="history.html" class="flex flex-col items-center text-gray-400 hover:text-blue-600 transition">
        <i class="fa-solid fa-clock-rotate-left text-lg"></i>
      </a>
      <a href="analytics.html" class="flex flex-col items-center text-blue-600">
        <i class="fa-solid fa-chart-pie text-lg"></i>
      </a>
      <a href="accounts.html" class="flex flex-col items-center text-gray-400 hover:text-blue-600 transition">
        <i class="fa-solid fa-wallet text-lg"></i>
      </a>
      <a href="goals.html" class="flex flex-col items-center text-gray-400 hover:text-gray-500 transition">
        <i class="fa-solid fa-bullseye text-lg"></i>
      </a>
    </nav>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="app.js"></script>

  <script>
    let selectedDate = new Date();
    let currentView = 'day';
    let currentTabType = 'expense';
    let currentFilterCat = 'all';
    let globalTransactions = [];

    const knownAccounts = ['SCB', 'KBANK', 'KTC', 'เงินสดในมือ', 'CASH', 'BANK', 'CREDIT', 'INVESTMENT'];

    const categoryStyles = {
      'อาหาร': { icon: 'fa-utensils', color: 'bg-orange-500', badge: 'text-orange-500' },
      'ข้าว': { icon: 'fa-utensils', color: 'bg-orange-500', badge: 'text-orange-500' },
      'ข้าวหมูกรอบ': { icon: 'fa-utensils', color: 'bg-amber-500', badge: 'text-amber-500' },
      'ที่พัก': { icon: 'fa-hotel', color: 'bg-blue-500', badge: 'text-blue-500' },
      'โรงแรม': { icon: 'fa-hotel', color: 'bg-blue-500', badge: 'text-blue-500' },
      'เดินทาง': { icon: 'fa-car', color: 'bg-indigo-500', badge: 'text-indigo-500' },
      'น้ำมัน': { icon: 'fa-gas-pump', color: 'bg-blue-600', badge: 'text-blue-600' },
      'ดูหนังฟังเพลง': { icon: 'fa-film', color: 'bg-pink-500', badge: 'text-pink-500' },
      'ช้อปปิ้ง': { icon: 'fa-bag-shopping', color: 'bg-purple-500', badge: 'text-purple-500' },
      'โทรศัพท์': { icon: 'fa-mobile-screen-button', color: 'bg-cyan-500', badge: 'text-cyan-500' },
      'รองเท้า': { icon: 'fa-shoe-prints', color: 'bg-amber-600', badge: 'text-amber-600' },
      'เงินเดือน': { icon: 'fa-arrow-down', color: 'bg-emerald-500', badge: 'text-emerald-500' },
      'ค่าจ้าง': { icon: 'fa-money-bill-wave', color: 'bg-teal-500', badge: 'text-teal-500' },
      'เบ็ดเตล็ด': { icon: 'fa-boxes-stacked', color: 'bg-gray-500', badge: 'text-gray-500' },
      'ชำระหนี้': { icon: 'fa-receipt', color: 'bg-rose-500', badge: 'text-rose-500' },
      'โอนเงิน': { icon: 'fa-right-left', color: 'bg-purple-500', badge: 'text-purple-500' }
    };

    function getCategoryStyle(catName) {
      if (categoryStyles[catName]) return categoryStyles[catName];
      for (let key in categoryStyles) {
        if (catName.includes(key)) return categoryStyles[key];
      }
      return { icon: 'fa-tag', color: 'bg-blue-600', badge: 'text-blue-600' };
    }

    function getCleanCategory(tx) {
      let rawCat = (tx.category || '').trim();
      let title = (tx.title || '').trim();

      // หาก category เป็นชื่อบัตรเครดิต (เช่น [KBANK]) หรือเป็นค่าบัญชีธนาคาร ให้ดึงหมวดหมู่จากชื่อรายการ (title) แทน
      if (!rawCat || knownAccounts.includes(rawCat) || (rawCat.startsWith('[') && rawCat.endsWith(']'))) {
        let cleanTitle = title.replace(/\[.*?\]\s*/g, ''); // ตัดข้อความในวงเล็บ เช่น [KBANK] ออก
        let firstWord = cleanTitle.split(/[\s(]/)[0];
        if (firstWord && !knownAccounts.includes(firstWord)) {
          return firstWord;
        }
        return 'เบ็ดเตล็ด';
      }
      return rawCat;
    }

    function getAccountChannelType(tx) {
      const type = (tx.type || '').toUpperCase();
      const title = (tx.title || '').trim();
      const cat = (tx.category || '').trim();

      if (type === 'CREDIT_CARD' || type === 'CREDIT_EXPENSE' || title.startsWith('[')) return 'CREDIT';
      if (cat.includes('เงินสด') || title.includes('เงินสด')) return 'CASH';
      return 'BANK';
    }

    function switchTabType(type) {
      currentTabType = type;
      currentFilterCat = 'all';
      
      let btnExpense = document.getElementById('tabExpense');
      let btnIncome = document.getElementById('tabIncome');
      let btnTransfer = document.getElementById('tabTransfer');

      [btnExpense, btnIncome, btnTransfer].forEach(b => {
        if (b) b.className = "py-2 text-gray-500 transition";
      });

      if (type === 'expense') {
        btnExpense.className = "py-2 bg-white rounded-lg shadow-sm text-red-500 font-bold transition";
        document.getElementById('breakdownTitle').innerText = "สัดส่วนรายจ่ายตามหมวดหมู่";
      } else if (type === 'income') {
        btnIncome.className = "py-2 bg-white rounded-lg shadow-sm text-emerald-600 font-bold transition";
        document.getElementById('breakdownTitle').innerText = "สัดส่วนรายรับตามหมวดหมู่";
      } else {
        btnTransfer.className = "py-2 bg-white rounded-lg shadow-sm text-purple-600 font-bold transition";
        document.getElementById('breakdownTitle').innerText = "สัดส่วนโอนเงิน / ชำระหนี้";
      }

      processAndRenderAnalytics();
    }

    function isWithinSelectedRange(itemDateStr) {
      if (!itemDateStr || currentView === 'all') return true;
      
      const itemDateOnly = itemDateStr.split('T')[0];
      const [itemY, itemM, itemD] = itemDateOnly.split('-').map(Number);

      const selY = selectedDate.getFullYear();
      const selM = selectedDate.getMonth() + 1;
      const selD = selectedDate.getDate();

      if (currentView === 'day') {
        const targetStr = `${selY}-${String(selM).padStart(2, '0')}-${String(selD).padStart(2, '0')}`;
        return itemDateOnly === targetStr;
      } else if (currentView === 'month') {
        return itemY === selY && itemM === selM;
      } else if (currentView === 'year') {
        return itemY === selY;
      } else if (currentView === 'custom') {
        const start = document.getElementById('startDate').value;
        const end = document.getElementById('endDate').value;
        if (!start || !end) return true;
        return itemDateOnly >= start && itemDateOnly <= end;
      }
      return true;
    }

    async function loadAnalyticsData() {
      if (typeof fetchTransactions === 'function') {
        globalTransactions = await fetchTransactions();
      }
      processAndRenderAnalytics();
    }

    function processAndRenderAnalytics() {
      const breakdownContainer = document.getElementById('breakdownContainer');
      const transactionContainer = document.getElementById('transactionContainer');
      const titleEl = document.getElementById('transactionListTitle');
      const resetBtn = document.getElementById('resetFilterBtn');

      breakdownContainer.innerHTML = '';
      transactionContainer.innerHTML = '';

      let filteredByDate = globalTransactions.filter(item => {
        const type = (item.type || '').toUpperCase();
        if (['CASH', 'BANK', 'CREDIT', 'INVESTMENT'].includes(type)) return false;
        const itemDate = item.date || item.created_at;
        return isWithinSelectedRange(itemDate);
      });

      let currentTypeTransactions = [];
      if (currentTabType === 'expense') {
        currentTypeTransactions = filteredByDate.filter(t => {
          const type = (t.type || '').toUpperCase();
          return type === 'EXPENSE' || type === 'CREDIT_CARD' || type === 'CREDIT_EXPENSE';
        });
      } else if (currentTabType === 'income') {
        currentTypeTransactions = filteredByDate.filter(t => (t.type || '').toUpperCase() === 'INCOME');
      } else {
        currentTypeTransactions = filteredByDate.filter(t => {
          const type = (t.type || '').toUpperCase();
          return type === 'TRANSFER' || type === 'PAY_DEBT';
        });
      }

      let cashTotal = 0;
      let bankTotal = 0;
      let creditTotal = 0;

      currentTypeTransactions.forEach(t => {
        const channel = getAccountChannelType(t);
        const amt = Math.abs(parseFloat(t.amount) || 0);

        if (channel === 'CASH') cashTotal += amt;
        else if (channel === 'CREDIT') creditTotal += amt;
        else bankTotal += amt;
      });

      document.getElementById('cashMethodTotal').innerText = `฿${cashTotal.toLocaleString()}`;
      document.getElementById('bankMethodTotal').innerText = `฿${bankTotal.toLocaleString()}`;
      document.getElementById('creditMethodTotal').innerText = `฿${creditTotal.toLocaleString()}`;

      let displayTransactions = currentTypeTransactions;
      if (currentFilterCat !== 'all') {
        displayTransactions = currentTypeTransactions.filter(t => getCleanCategory(t) === currentFilterCat);
        resetBtn.classList.remove('hidden');
        titleEl.innerText = `รายการหมวดหมู่: ${currentFilterCat}`;
      } else {
        titleEl.innerText = currentTabType === 'expense' ? "รายการรายจ่ายทั้งหมดในช่วงนี้" : currentTabType === 'income' ? "รายการรายรับทั้งหมดในช่วงนี้" : "รายการโอน/ชำระหนี้ทั้งหมดในช่วงนี้";
        resetBtn.classList.add('hidden');
      }

      let categoryTotals = {};
      let totalAmountAll = 0;

      currentTypeTransactions.forEach(t => {
        const cat = getCleanCategory(t);
        const amt = Math.abs(parseFloat(t.amount) || 0);
        categoryTotals[cat] = (categoryTotals[cat] || 0) + amt;
        totalAmountAll += amt;
      });

      const categoriesKeys = Object.keys(categoryTotals);
      if (categoriesKeys.length === 0) {
        breakdownContainer.innerHTML = `<p class="text-center text-gray-400 py-4">ไม่มีข้อมูลในช่วงเวลานี้</p>`;
      } else {
        let breakdownHTML = '';
        categoriesKeys.forEach(cat => {
          let amt = categoryTotals[cat];
          let percent = totalAmountAll > 0 ? Math.round((amt / totalAmountAll) * 100) : 0;
          let style = getCategoryStyle(cat);
          let isSelectedBorder = currentFilterCat === cat ? 'border-blue-400 bg-blue-50/50' : 'border-transparent hover:border-gray-200';

          breakdownHTML += `
            <div onclick="filterByCategory('${cat}')" class="p-2 rounded-xl cursor-pointer hover:bg-gray-50 transition border ${isSelectedBorder}">
              <div class="flex justify-between mb-1">
                <span class="font-medium text-gray-700 flex items-center gap-2">
                  <i class="fa-solid ${style.icon} ${style.badge}"></i> ${cat}
                </span>
                <span class="font-bold text-gray-800">฿${amt.toLocaleString()} (${percent}%)</span>
              </div>
              <div class="w-full bg-gray-100 h-2 rounded-full overflow-hidden">
                <div class="${style.color} h-full rounded-full" style="width: ${percent}%"></div>
              </div>
            </div>
          `;
        });
        breakdownContainer.innerHTML = breakdownHTML;
      }

      if (displayTransactions.length === 0) {
        transactionContainer.innerHTML = `<p class="text-center text-gray-400 py-4">ไม่พบรายการในช่วงเวลานี้</p>`;
        return;
      }

      let txHTML = '';
      displayTransactions.forEach(tx => {
        const type = (tx.type || '').toUpperCase();
        let isIncome = type === 'INCOME';
        let amountColor = isIncome ? 'text-emerald-600' : type === 'PAY_DEBT' ? 'text-purple-600' : type === 'TRANSFER' ? 'text-amber-600' : 'text-rose-600';
        let sign = isIncome ? '+' : '-';
        let amt = Math.abs(parseFloat(tx.amount) || 0);
        let timeStr = tx.created_at ? new Date(tx.created_at).toLocaleDateString('th-TH') : '';
        let catName = getCleanCategory(tx);
        let style = getCategoryStyle(catName);

        txHTML += `
          <div class="flex items-center justify-between p-2.5 bg-gray-50 rounded-xl border border-gray-100">
            <div class="flex items-center gap-2.5">
              <div class="w-8 h-8 rounded-lg ${isIncome ? 'bg-emerald-100 text-emerald-600' : 'bg-rose-100 text-rose-600'} flex items-center justify-center">
                <i class="fa-solid ${style.icon}"></i>
              </div>
              <div>
                <p class="font-semibold text-gray-800">${tx.title || catName}</p>
                <p class="text-[10px] text-gray-400">${catName} • ${timeStr}</p>
              </div>
            </div>
            <span class="font-bold ${amountColor}">${sign}฿${amt.toLocaleString()}</span>
          </div>
        `;
      });
      transactionContainer.innerHTML = txHTML;
    }

    function filterByCategory(cat) {
      currentFilterCat = (currentFilterCat === cat) ? 'all' : cat;
      processAndRenderAnalytics();
    }

    function updateDateDisplay() {
      const year = selectedDate.getFullYear();
      const month = String(selectedDate.getMonth() + 1).padStart(2, '0');
      const day = String(selectedDate.getDate()).padStart(2, '0');
      
      let displayText = '';
      if (currentView === 'day') displayText = `${year}-${month}-${day}`;
      else if (currentView === 'month') displayText = `${year}-${month}`;
      else if (currentView === 'year') displayText = `${year}`;

      document.getElementById('currentDateDisplay').innerText = displayText;
      document.getElementById('analyticsHeaderBadge').innerText = displayText;
      loadAnalyticsData();
    }

    function changeDate(direction) {
      if (currentView === 'day') selectedDate.setDate(selectedDate.getDate() + direction);
      else if (currentView === 'month') selectedDate.setMonth(selectedDate.getMonth() + direction);
      else if (currentView === 'year') selectedDate.setFullYear(selectedDate.getFullYear() + direction);
      updateDateDisplay();
    }

    function switchView(viewType) {
      currentView = viewType;
      ['viewDay', 'viewMonth', 'viewYear', 'viewAll', 'viewCustom'].forEach(id => {
        let el = document.getElementById(id);
        if(el) el.className = "cursor-pointer hover:text-black pb-1";
      });
      
      let activeEl = document.getElementById('view' + viewType.charAt(0).toUpperCase() + viewType.slice(1));
      if(activeEl) activeEl.className = "font-bold text-blue-600 border-b-2 border-blue-600 pb-1 cursor-pointer";

      let singleController = document.getElementById('singleDateController');
      let customController = document.getElementById('customRangeController');

      if (viewType === 'custom') {
        singleController.classList.add('hidden');
        customController.classList.remove('hidden');
        document.getElementById('analyticsHeaderBadge').innerText = "ช่วงที่กำหนด";
      } else if (viewType === 'all') {
        singleController.classList.add('hidden');
        customController.classList.add('hidden');
        document.getElementById('analyticsHeaderBadge').innerText = "ข้อมูลทั้งหมด";
      } else {
        singleController.classList.remove('hidden');
        customController.classList.add('hidden');
      }
      loadAnalyticsData();
    }

    function handleLogout() {
      if (typeof signOut === 'function') {
        signOut();
      } else {
        window.location.href = 'login.html';
      }
    }

    document.addEventListener('DOMContentLoaded', async () => {
      // ตรวจสอบ Authentication
      if (typeof getCurrentUser === 'function') {
        const user = await getCurrentUser();
        if (!user) {
          window.location.href = 'login.html';
          return;
        }

        const emailDisplay = document.getElementById('userEmailDisplay');
        if (emailDisplay && user.email) {
          const username = user.email.split('@')[0];
          emailDisplay.innerText = `คุณ ${username}`;
        }
      }

      updateDateDisplay();
    });
  </script>
</body>
</html>
